name: STweaks PowerShell preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout STweaks sources
        uses: actions/checkout@v4

      - name: Compile and check the distributable script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Compile.ps1
          if (-not (Test-Path -LiteralPath ./winutil.ps1)) {
            throw 'Compile.ps1 did not create winutil.ps1'
          }
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'winutil.ps1'), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'The compiled script has PowerShell parser errors.'
          }
          $source = Get-Content -LiteralPath ./winutil.ps1 -Raw -Encoding UTF8
          if (-not $source.Contains('Register-STweaksScanHandlers') -or
              -not $source.Contains('STweaks') -or
              -not $source.Contains('Windows.Markup.XamlReader')) {
            throw 'The compiled script is missing the STweaks interface.'
          }
          (Get-FileHash -Algorithm SHA256 -LiteralPath ./winutil.ps1).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath ./stweaks.sha256 -NoNewline

      - name: Publish a versioned preview script
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "stweaks-preview-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create $tag ./winutil.ps1 ./stweaks.sha256 `
            --target '${{ github.sha }}' `
            --title "STweaks preview $tag" `
            --notes 'Generated by Compile.ps1 from this exact source revision. Start the script from an elevated Windows PowerShell session to open the STweaks interface.' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish STweaks preview.' }
          Write-Host "PowerShell URL: https://github.com/${{ github.repository }}/releases/download/$tag/winutil.ps1"
